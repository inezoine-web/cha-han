<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101518">
  <title>cha-han｜米の運動モデル試作</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Noto Sans JP",sans-serif;background:#0d1214;color:#edf2f3}*{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:linear-gradient(#11191c,#090d0f);overscroll-behavior:none}main{width:min(100%,560px);margin:auto;padding:15px 13px 30px}
    header{display:flex;align-items:end;justify-content:space-between;margin:0 3px 10px}h1{margin:0;font-size:1.12rem;letter-spacing:.06em}.tag{margin:0;color:#86979d;font-size:.66rem}
    .panel{padding:12px;border:1px solid #39474c;border-radius:18px;background:#161e21;box-shadow:0 18px 50px #0008}.status{display:flex;justify-content:space-between;gap:8px;margin:0 3px 9px;color:#aab8bc;font-size:.72rem}.status output{color:#efc16e;font-variant-numeric:tabular-nums}
    canvas{display:block;width:100%;height:auto;border:1px solid #425158;border-radius:13px;background:#0a0f11;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.readout{margin:8px 2px 10px;color:#aebcc0;font-size:.7rem;line-height:1.5;font-variant-numeric:tabular-nums}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{min-height:48px;border:0;border-radius:12px;background:#e0a84e;color:#17130b;font:700 .88rem inherit;box-shadow:0 3px 0 #835e27;cursor:pointer;touch-action:manipulation}button.secondary{background:#35444a;color:#e7edef;box-shadow:0 3px 0 #202a2e}button:disabled{cursor:wait;filter:saturate(.35);opacity:.7}button:active{transform:translateY(2px);box-shadow:none}
    details{margin-top:11px;border:1px solid #344147;border-radius:13px;background:#111719}summary{padding:12px;color:#d8e0e2;font-size:.82rem;font-weight:700;cursor:pointer}.controls{display:grid;grid-template-columns:1fr 1fr;gap:11px 13px;padding:0 12px 12px}.control label{display:flex;justify-content:space-between;gap:5px;color:#aebcc0;font-size:.68rem}.control output{color:#efc16e;font-weight:700}input[type=range]{width:100%;height:27px;margin:2px 0 0;accent-color:#e9b25a}.hint{margin:11px 4px 0;color:#7f9095;text-align:center;font-size:.68rem;line-height:1.55}
    .search{display:grid;gap:9px;padding:0 12px 12px}.search-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.search label{color:#aebcc0;font-size:.7rem}.search select{width:100%;min-height:43px;margin-top:4px;padding:8px;border:1px solid #4a5a60;border-radius:9px;background:#202a2e;color:#edf2f3;font:inherit}.search-note{min-height:2.8em;margin:0;color:#93a3a8;font-size:.67rem;line-height:1.45;font-variant-numeric:tabular-nums}
    @media(max-width:380px){.controls{grid-template-columns:1fr}main{padding-inline:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body><main>
  <header><h1>米の運動モデル試作</h1><p class="tag">SIDE VIEW / 仮説検証</p></header>
  <section class="panel" aria-label="中華鍋の断面粒子シミュレーション">
    <div class="status"><span id="sensorState">手動入力</span><output id="riceCount">固着 36 · 滑走 0 · 飛翔 0</output></div>
    <canvas id="scene" width="520" height="360" aria-label="横から見た中華鍋と米。右へ押し、素早く止め、左へ戻すようにドラッグできます"></canvas>
    <p id="readout" class="readout" aria-live="polite">鍋を右へ押し、素早く減速してから左へ戻してください。</p>
    <div class="actions"><button id="demo" type="button">自動で一振り</button><button id="reset" class="secondary" type="button">リセット・センサー開始</button></div>
    <details><summary>広域探索</summary><div class="search">
      <div class="search-actions"><button id="search" type="button">2,500設定を探索</button><button id="replay" class="secondary" type="button" disabled>選択結果を再生</button></div>
      <label for="searchResults">上位パラメーターセット（最大500件）<select id="searchResults" disabled><option>探索結果はまだありません</option></select></label>
      <p id="searchStatus" class="search-note" aria-live="polite">8項目をランダムサンプリングし、離床・回収・残存率から順位付けします。結果はこのブラウザに保存します。</p>
    </div></details>
    <details open><summary>調整パラメーター</summary><div class="controls" id="controls">
      <div class="control"><label for="gain"><span>入力強度</span><output></output></label><input id="gain" data-unit="×" type="range" min="0.4" max="2.5" value="1.2" step="0.1"></div>
      <div class="control"><label for="staticFriction"><span>静止摩擦 μs</span><output></output></label><input id="staticFriction" type="range" min="0.05" max="1.2" value="0.48" step="0.01"></div>
      <div class="control"><label for="kineticFriction"><span>動摩擦 μk</span><output></output></label><input id="kineticFriction" type="range" min="0" max="0.8" value="0.18" step="0.01"></div>
      <div class="control"><label for="cohesion"><span>凝集抵抗</span><output></output></label><input id="cohesion" type="range" min="0" max="0.8" value="0.22" step="0.01"></div>
      <div class="control"><label for="depth"><span>鍋の深さ</span><output></output></label><input id="depth" data-unit=" px" type="range" min="55" max="125" value="88" step="1"></div>
      <div class="control"><label for="lift"><span>離床感度</span><output></output></label><input id="lift" data-unit="×" type="range" min="0.4" max="2.2" value="1.15" step="0.05"></div>
      <div class="control"><label for="bounce"><span>着地反発</span><output></output></label><input id="bounce" type="range" min="0" max="0.6" value="0.18" step="0.01"></div>
      <div class="control"><label for="spread"><span>粒ごとのばらつき</span><output></output></label><input id="spread" data-unit="%" type="range" min="0" max="40" value="18" step="1"></div>
    </div></details>
    <p class="hint">ドラッグ／←→キーでも操作できます。センサーは画面を上にして水平な状態で開始してください。端末をしっかり持ち、周囲の安全を確認してください。</p>
  </section>
</main><script>
(()=>{'use strict';
  const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),stateEl=document.querySelector('#sensorState'),countEl=document.querySelector('#riceCount'),readout=document.querySelector('#readout'),searchButton=document.querySelector('#search'),replayButton=document.querySelector('#replay'),resultSelect=document.querySelector('#searchResults'),searchStatus=document.querySelector('#searchStatus');
  const sliders=[...document.querySelectorAll('input[type=range]')],p=Object.fromEntries(sliders.map(e=>[e.id,()=>Number(e.value)]));
  const TOTAL=36,RIM=188,BOTTOM_Y=294,G=0.115,SEARCH_COUNT=2500,KEEP_COUNT=500,STORE_KEY='cha-han-search-v1';let grains=[],wok={x:0,vx:0,ax:0,az:0},pointer=null,last=performance.now(),baseline=null,listening=false,demoStart=0,lastPointerTime=0,searchResults=[];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(i)=>{const x=Math.sin(i*91.73+4.1)*43758.5453;return x-Math.floor(x);};
  const floorAt=x=>BOTTOM_Y-p.depth()*(x/RIM)**2,slopeAt=x=>-2*p.depth()*x/(RIM*RIM);
  function updateLabels(){for(const e of sliders){const digits=e.step.includes('.')?(e.step.split('.')[1]||'').length:0;e.previousElementSibling.querySelector('output').value=Number(e.value).toFixed(Math.min(2,digits))+(e.dataset.unit||'');}}
  function seed(){wok={x:0,vx:0,ax:0,az:0};grains=Array.from({length:TOTAL},(_,i)=>{const x=(rand(i)-.5)*78;return{x,z:floorAt(x)-4,vx:0,vz:0,state:'STUCK',lost:false,variation:(rand(i+60)-.5)*2};});updateStatus();}
  function updateStatus(){const n={STUCK:0,SLIDING:0,AIRBORNE:0};for(const g of grains)if(!g.lost)n[g.state]++;countEl.value=`固着 ${n.STUCK} · 滑走 ${n.SLIDING} · 飛翔 ${n.AIRBORNE}`;}
  function drive(ax,az=0){wok.ax=clamp(ax*p.gain(),-1.8,1.8);wok.az=clamp(az*p.gain(),-1.2,1.2);}
  function motion(e){const a=e.acceleration||e.accelerationIncludingGravity;if(!a)return;if(!baseline){baseline={x:a.x||0,z:a.z||0};stateEl.textContent='センサー計測中';return;}drive(-((a.x||0)-baseline.x)*.13,-((a.z||0)-baseline.z)*.07);}
  async function reset(){seed();baseline=null;demoStart=0;readout.textContent='水平のまま少し待ってください…';try{if(!('DeviceMotionEvent'in window))throw Error('センサー非対応');if(typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw Error('センサー未許可');if(!listening){addEventListener('devicemotion',motion,{passive:true});listening=true;}stateEl.textContent='水平調整待ち';}catch(e){stateEl.textContent='手動入力';readout.textContent=`${e.message} — ドラッグまたは自動一振りで試せます。`;}}
  function demo(now){if(!demoStart)return;const t=(now-demoStart)/1000;let a=0,z=0;if(t<.34)a=.62;else if(t<.52){a=-1.48;z=-.38;}else if(t<.88)a=-.28;else if(t<1.18)a=.42;else{demoStart=0;readout.textContent='一振り完了。粒の状態と回収を確認してください。';}drive(a,z);}
  function waveform(t){if(t<.34)return[.62,0];if(t<.52)return[-1.48,-.38];if(t<.88)return[-.28,0];if(t<1.18)return[.42,0];return[0,0];}
  function candidate(){const values={};for(const e of sliders){const min=Number(e.min),max=Number(e.max),step=Number(e.step);values[e.id]=Math.round((min+Math.random()*(max-min))/step)*step;values[e.id]=clamp(values[e.id],min,max);}return values;}
  function simulate(values){const floor=x=>BOTTOM_Y-values.depth*(x/RIM)**2,slope=x=>-2*values.depth*x/(RIM*RIM),sw={x:0,vx:0,ax:0,az:0};const gs=Array.from({length:TOTAL},(_,i)=>{const x=(rand(i)-.5)*78;return{x,z:floor(x)-4,vx:0,vz:0,state:'STUCK',lost:false,variation:(rand(i+60)-.5)*2,launched:false,returned:false,maxRise:0};});
    for(let frame=0;frame<180;frame++){const t=frame/60;if(t<1.18){const [rawX,rawZ]=waveform(t);sw.ax=clamp(rawX*values.gain,-1.8,1.8);sw.az=clamp(rawZ*values.gain,-1.2,1.2);}sw.vx=clamp(sw.vx+sw.ax,-8,8);sw.x=clamp(sw.x+sw.vx,-42,42);if(Math.abs(sw.x)>=42)sw.vx*=.35;
      for(const g of gs){if(g.lost)continue;const variation=1+g.variation*values.spread/100;if(g.state==='AIRBORNE'){g.vz+=G;g.x+=g.vx;g.z+=g.vz;g.maxRise=Math.max(g.maxRise,floor(g.x-sw.x)-4-g.z);const rel=g.x-sw.x;if(Math.abs(rel)<RIM&&g.z>=floor(rel)-4){g.x=rel+sw.x;g.z=floor(rel)-4;g.vz=g.vz>0?-g.vz*values.bounce:0;g.vx=sw.vx+(g.vx-sw.vx)*.58;g.state=Math.abs(g.vz)>.55?'AIRBORNE':'SLIDING';g.returned=true;}else if(g.z>350||Math.abs(rel)>RIM+45)g.lost=true;continue;}
        let rel=g.x-sw.x,s=slope(rel),norm=Math.sqrt(1+s*s),tx=1/norm,tz=s/norm;const tangential=-sw.ax*tx+G*tz,normal=(G+sw.az)*tx+(g.vx-sw.vx)**2*(2*values.depth/(RIM*RIM)),yieldForce=values.staticFriction*Math.max(0,normal)+values.cohesion*variation;if(g.state==='STUCK'){g.x+=sw.vx;g.vx=sw.vx;g.z=floor(g.x-sw.x)-4;if(Math.abs(tangential)>yieldForce)g.state='SLIDING';}else{const rv=g.vx-sw.vx,friction=values.kineticFriction*Math.max(0,normal)*Math.sign(rv||tangential);g.vx+=(-sw.ax-friction)*tx;g.x+=g.vx;rel=g.x-sw.x;g.z=floor(rel)-4;if(Math.abs(g.vx-sw.vx)<.08&&Math.abs(tangential)<yieldForce*.82){g.state='STUCK';g.vx=sw.vx;}}
        rel=g.x-sw.x;s=slope(rel);const separation=-sw.az*values.lift-G/Math.sqrt(1+s*s)+Math.abs(g.vx-sw.vx)*Math.abs(s)*.018;if(g.state==='SLIDING'&&separation>.12&&Math.abs(rel)>35){const n=Math.sqrt(1+s*s);g.state='AIRBORNE';g.launched=true;g.vz=(g.vx-sw.vx)*s/n+sw.az*2.2;g.vx=sw.vx+(g.vx-sw.vx)/n;}if(Math.abs(rel)>RIM+8){g.state='AIRBORNE';g.launched=true;g.vz=Math.min(g.vz,-.15);}}
      sw.ax*=.72;sw.az*=.65;sw.vx*=.94;
    }
    const launched=gs.filter(g=>g.launched).length,returned=gs.filter(g=>g.returned&&!g.lost).length,lost=gs.filter(g=>g.lost).length,maxHeight=Math.max(0,...gs.map(g=>g.maxRise));return{launched,returned,lost,maxHeight,score:45*launched/TOTAL+45*returned/TOTAL+10*(TOTAL-lost)/TOTAL-30*lost/TOTAL};
  }
  function renderResults(){resultSelect.replaceChildren();for(let i=0;i<searchResults.length;i++){const r=searchResults[i],o=document.createElement('option');o.value=i;o.textContent=`${i+1}位 ${r.score.toFixed(1)}点｜離床${r.launched} 回収${r.returned} 損失${r.lost}`;resultSelect.append(o);}const ready=searchResults.length>0;resultSelect.disabled=!ready;replayButton.disabled=!ready;if(ready){const r=searchResults[0];searchStatus.textContent=`${searchResults.length}件を保存。1位: 離床 ${r.launched}/${TOTAL}、回収 ${r.returned}/${TOTAL}、損失 ${r.lost}/${TOTAL}、最大高さ ${r.maxHeight.toFixed(0)} px`;}}
  function applyResult(){const r=searchResults[Number(resultSelect.value)];if(!r)return;for(const e of sliders)e.value=r.values[e.id];updateLabels();seed();demoStart=performance.now();stateEl.textContent=`探索 ${Number(resultSelect.value)+1}位を再生`;}
  async function search(){searchButton.disabled=true;replayButton.disabled=true;demoStart=0;searchResults=[];const best=[];for(let start=0;start<SEARCH_COUNT;start+=25){for(let i=start;i<Math.min(start+25,SEARCH_COUNT);i++){const values=candidate(),metrics=simulate(values);best.push({...metrics,values});}best.sort((a,b)=>b.score-a.score||b.returned-a.returned||b.launched-a.launched||a.lost-b.lost||b.maxHeight-a.maxHeight);best.length=Math.min(best.length,KEEP_COUNT);searchStatus.textContent=`探索中… ${Math.min(start+25,SEARCH_COUNT).toLocaleString()} / ${SEARCH_COUNT.toLocaleString()} 設定`;await new Promise(requestAnimationFrame);}searchResults=best;try{localStorage.setItem(STORE_KEY,JSON.stringify(searchResults));}catch(e){searchStatus.textContent=`探索完了。ただしブラウザへ保存できませんでした: ${e.message}`;}renderResults();searchButton.disabled=false;}
  function step(dt){wok.vx=clamp(wok.vx+wok.ax*dt,-8,8);wok.x=clamp(wok.x+wok.vx*dt,-42,42);if(Math.abs(wok.x)>=42)wok.vx*=.35;const spread=p.spread()/100;
    for(const g of grains){if(g.lost)continue;const variation=1+g.variation*spread;
      if(g.state==='AIRBORNE'){g.vz+=G*dt;g.x+=g.vx*dt;g.z+=g.vz*dt;const rel=g.x-wok.x;if(Math.abs(rel)<RIM&&g.z>=floorAt(rel)-4){g.x=rel+wok.x;g.z=floorAt(rel)-4;g.vz=g.vz>0?-g.vz*p.bounce():0;g.vx=wok.vx+(g.vx-wok.vx)*.58;g.state=Math.abs(g.vz)>.55?'AIRBORNE':'SLIDING';}else if(g.z>350||Math.abs(rel)>RIM+45)g.lost=true;continue;}
      let rel=g.x-wok.x,s=slopeAt(rel),norm=Math.sqrt(1+s*s),tx=1/norm,tz=s/norm;const tangential=(-wok.ax*tx+G*tz),normal=(G+wok.az)*tx+(g.vx-wok.vx)**2*(2*p.depth()/(RIM*RIM));const yieldForce=p.staticFriction()*Math.max(0,normal)+p.cohesion()*variation;
      if(g.state==='STUCK'){g.x+=wok.vx*dt;g.vx=wok.vx;g.z=floorAt(g.x-wok.x)-4;if(Math.abs(tangential)>yieldForce)g.state='SLIDING';}
      else{const rv=g.vx-wok.vx,friction=p.kineticFriction()*Math.max(0,normal)*Math.sign(rv||tangential);g.vx+=(-wok.ax-friction)*tx*dt;g.x+=g.vx*dt;rel=g.x-wok.x;g.z=floorAt(rel)-4;if(Math.abs(g.vx-wok.vx)<.08&&Math.abs(tangential)<yieldForce*.82){g.state='STUCK';g.vx=wok.vx;}}
      rel=g.x-wok.x;s=slopeAt(rel);const separation=(-wok.az*p.lift())-(G/(Math.sqrt(1+s*s)))+(Math.abs(g.vx-wok.vx)*Math.abs(s)*.018);if(g.state==='SLIDING'&&separation>.12&&Math.abs(rel)>35){const n=Math.sqrt(1+s*s);g.state='AIRBORNE';g.vz=(g.vx-wok.vx)*s/n+wok.az*2.2;g.vx=wok.vx+(g.vx-wok.vx)/n;}
      if(Math.abs(rel)>RIM+8){g.state='AIRBORNE';g.vz=Math.min(g.vz,-.15);}
    }
    wok.ax*=Math.pow(.72,dt);wok.az*=Math.pow(.65,dt);wok.vx*=Math.pow(.94,dt);
  }
  function draw(){ctx.clearRect(0,0,520,360);const cx=260+wok.x;ctx.fillStyle='#11191c';ctx.fillRect(0,0,520,360);ctx.strokeStyle='#273338';ctx.lineWidth=1;for(let y=60;y<320;y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(520,y);ctx.stroke();}
    ctx.fillStyle='#202b2f';ctx.beginPath();ctx.moveTo(cx-RIM,floorAt(-RIM));for(let x=-RIM;x<=RIM;x+=5)ctx.lineTo(cx+x,floorAt(x));for(let x=RIM;x>=-RIM;x-=5)ctx.lineTo(cx+x,floorAt(x)+10);ctx.closePath();ctx.fill();
    const rimY=floorAt(RIM);ctx.fillStyle='#8a989d';ctx.fillRect(cx+RIM-2,rimY-1,73,7);ctx.fillStyle='#c39448';ctx.fillRect(cx+RIM+57,rimY-4,42,13);
    for(const g of grains){if(g.lost)continue;const color={STUCK:'#e6d49c',SLIDING:'#f1b85e',AIRBORNE:'#fff1ba'}[g.state];ctx.save();ctx.translate(260+g.x,g.z);ctx.rotate(Math.atan2(g.vz,g.vx||.01));if(g.state==='AIRBORNE'){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(2,3,5,2.5,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,0,5,2.3,0,0,Math.PI*2);ctx.fill();ctx.restore();}
    ctx.strokeStyle='#718087';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx-RIM,floorAt(-RIM));for(let x=-RIM;x<=RIM;x+=5)ctx.lineTo(cx+x,floorAt(x));for(let x=RIM;x>=-RIM;x-=5)ctx.lineTo(cx+x,floorAt(x)+10);ctx.closePath();ctx.stroke();
    ctx.font='11px system-ui';ctx.fillStyle='#829196';ctx.fillText('← 身体側',14,25);ctx.fillText('前方 →',457,25);ctx.fillStyle='#e9b25a';ctx.fillRect(15,42,8,8);ctx.fillStyle='#9dacb0';ctx.fillText('滑走',28,50);ctx.fillStyle='#fff1ba';ctx.fillRect(72,42,8,8);ctx.fillStyle='#9dacb0';ctx.fillText('飛翔',85,50);
  }
  function frame(now){const dt=Math.min(2,(now-last)/16.67);last=now;demo(now);step(dt);draw();updateStatus();readout.textContent=demoStart?`自動入力  鍋速度 ${wok.vx.toFixed(2)} / 加速度 ${wok.ax.toFixed(2)}`:`鍋速度 ${wok.vx.toFixed(2)} / 加速度 ${wok.ax.toFixed(2)} — 右へ押して急減速、左へ回収`;requestAnimationFrame(frame);}
  canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};lastPointerTime=performance.now();canvas.setPointerCapture(e.pointerId);demoStart=0;});canvas.addEventListener('pointermove',e=>{if(!pointer)return;const now=performance.now(),scale=16/Math.max(8,now-lastPointerTime),dx=(e.clientX-pointer.x)*scale,dy=(e.clientY-pointer.y)*scale;drive(dx*.055,dy*.035);pointer={x:e.clientX,y:e.clientY};lastPointerTime=now;});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();drive(e.key==='ArrowRight'?.62:-1.1,e.shiftKey?-.35:0);}});for(const e of sliders)e.addEventListener('input',()=>{updateLabels();if(e.id==='depth')for(const g of grains)if(g.state!=='AIRBORNE')g.z=floorAt(g.x-wok.x)-4;});document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#demo').addEventListener('click',()=>{seed();demoStart=performance.now();stateEl.textContent='再現入力';});searchButton.addEventListener('click',search);replayButton.addEventListener('click',applyResult);resultSelect.addEventListener('change',()=>{const r=searchResults[Number(resultSelect.value)];if(r)searchStatus.textContent=`離床 ${r.launched}/${TOTAL}、回収 ${r.returned}/${TOTAL}、損失 ${r.lost}/${TOTAL}、最大高さ ${r.maxHeight.toFixed(0)} px、${r.score.toFixed(1)}点`;});
  try{const stored=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');if(Array.isArray(stored))searchResults=stored.slice(0,KEEP_COUNT);}catch(e){searchResults=[];}updateLabels();seed();renderResults();requestAnimationFrame(frame);
})();</script></body></html>
