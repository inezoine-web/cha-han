<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#17120f">
  <title>cha-han｜鍋振りトレーナー</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Noto Sans JP",sans-serif;background:#17120f;color:#fff8e8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 25%,#483122,#17120f 62%);overscroll-behavior:none}
    main{width:min(100%,480px);min-height:100dvh;margin:auto;padding:20px 18px 28px;display:flex;flex-direction:column;align-items:center}
    header{text-align:center}h1{font-size:clamp(1.55rem,7vw,2.25rem);margin:.2rem 0}.lead{margin:.25rem 0 1rem;color:#dfcbb4;font-size:.9rem}
    .panel{width:100%;padding:14px;border:1px solid #6f513b;border-radius:18px;background:#211915cc;box-shadow:0 16px 44px #0007}
    .meter{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px}.meter strong{font-size:1.45rem}.meter span{color:#dfcbb4;font-size:.85rem}
    .bar{height:10px;overflow:hidden;border-radius:10px;background:#4c352b}.bar>i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#e34b35,#f2c14e);transition:width .2s}
    canvas{display:block;width:100%;height:auto;margin:8px 0 2px;border-radius:16px;background:linear-gradient(#15100e,#291c15);touch-action:none}
    .message{min-height:2.8em;margin:8px 0;color:#f3dfc3;text-align:center;font-size:.9rem}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{min-height:50px;border:0;border-radius:13px;background:#d84b2f;color:white;font:700 1rem inherit;box-shadow:0 4px 0 #842a1c;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #842a1c}button.secondary{background:#584137;box-shadow:0 4px 0 #2c211d}
    #sensor{grid-column:1/-1;background:#e06032}.hint{margin:13px 5px 0;color:#bca895;text-align:center;font-size:.76rem;line-height:1.55}.debug{font-variant-numeric:tabular-nums}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main>
  <header><h1>炒飯・鍋振り道場</h1><p class="lead">こぼさず返して、米を守ろう。</p></header>
  <section class="panel" aria-label="鍋振りシミュレーター">
    <div class="meter"><strong id="remaining">米の残量 100%</strong><span id="sensorState">センサー未接続</span></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <canvas id="scene" width="420" height="320" aria-label="中華鍋と米粒のシミュレーション"></canvas>
    <p id="message" class="message" aria-live="polite">センサーを有効にするか、左右ボタンで鍋を振ってください。</p>
    <div class="controls">
      <button id="left" class="secondary" type="button">← 左へ振る</button>
      <button id="right" class="secondary" type="button">右へ振る →</button>
      <button id="sensor" type="button">センサーを有効にする</button>
    </div>
    <p class="hint">PC: ← → キーでも操作できます。<br><span class="debug" id="debug">加速度 x: 0.00 / y: 0.00</span><br>スマートフォンを落とさないよう、周囲を確認してください。</p>
  </section>
</main>
<script>
(() => {
  'use strict';
  const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
  const remainingEl=document.querySelector('#remaining'),bar=document.querySelector('#bar');
  const message=document.querySelector('#message'),sensorState=document.querySelector('#sensorState'),debug=document.querySelector('#debug');
  const TOTAL=60,RIM=174,CX=210,BOTTOM=270; let grains=[],impulse=0,listening=false,last=performance.now();
  const floorY=x=>BOTTOM-.0047*(x-CX)*(x-CX);
  function reset(){grains=Array.from({length:TOTAL},()=>({x:CX+(Math.random()-.5)*74,y:230-Math.random()*20,vx:(Math.random()-.5)*.25,vy:0})); update();}
  function update(){const pct=Math.round(grains.length/TOTAL*100);remainingEl.textContent=`米の残量 ${pct}%`;bar.style.width=`${pct}%`;message.textContent=pct===0?'全部こぼれました。ボタンで再挑戦できます。':pct<70?'こぼれています。小さく素早く返そう。':'短く振って、反対方向で受け止めよう。';}
  function toss(direction){if(!grains.length)reset(); impulse+=direction*2.8; grains.forEach(g=>{g.vy-=Math.abs(direction)*(.8+Math.random()*.8)});}
  function motion(event){const a=event.acceleration||event.accelerationIncludingGravity||{};const x=Number.isFinite(a.x)?a.x:0,y=Number.isFinite(a.y)?a.y:0;impulse+=Math.max(-2.2,Math.min(2.2,-x*.075));debug.textContent=`加速度 x: ${x.toFixed(2)} / y: ${y.toFixed(2)}`;}
  async function enableSensor(){const button=document.querySelector('#sensor');try{if(!('DeviceMotionEvent'in window))throw new Error('このブラウザでは利用できません');if(typeof DeviceMotionEvent.requestPermission==='function'){if(await DeviceMotionEvent.requestPermission()!=='granted')throw new Error('許可されませんでした');}if(!listening){window.addEventListener('devicemotion',motion,{passive:true});listening=true;}sensorState.textContent='センサー接続済み';button.textContent='米をセットし直す';reset();}catch(error){sensorState.textContent='センサー利用不可';message.textContent=`${error.message}。左右ボタンで試せます。`;}}
  function drawWok(){ctx.strokeStyle='#9c7963';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(CX-RIM,floorY(CX-RIM));ctx.quadraticCurveTo(CX,BOTTOM+12,CX+RIM,floorY(CX+RIM));ctx.stroke();ctx.strokeStyle='#4c352b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(CX+RIM-2,floorY(CX+RIM));ctx.lineTo(414,76);ctx.stroke();}
  function frame(now){const dt=Math.min(2,(now-last)/16.67);last=now;ctx.clearRect(0,0,canvas.width,canvas.height);drawWok();const kept=[];for(const g of grains){g.vx+=(impulse*.105)*dt;g.vy+=.18*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;const floor=floorY(g.x);if(Math.abs(g.x-CX)<RIM&&g.y>floor){g.y=floor;g.vy*=-.25;const slope=-.0094*(g.x-CX);g.vx+=slope*.32;g.vx*=.91;}if(g.x>-8&&g.x<428&&g.y<330){kept.push(g);ctx.fillStyle='#fff0bd';ctx.beginPath();ctx.ellipse(g.x,g.y,4,2.2,g.vx*.12,0,Math.PI*2);ctx.fill();}}if(kept.length!==grains.length){grains=kept;update();}impulse*=Math.pow(.78,dt);requestAnimationFrame(frame);}
  document.querySelector('#left').addEventListener('click',()=>toss(-1));document.querySelector('#right').addEventListener('click',()=>toss(1));document.querySelector('#sensor').addEventListener('click',enableSensor);
  window.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();toss(event.key==='ArrowLeft'?-1:1);}});
  reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
