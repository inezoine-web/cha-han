<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101518">
  <title>cha-han｜鍋振り試作機</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Noto Sans JP",sans-serif;background:#101518;color:#edf2f3}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101518;overscroll-behavior:none}
    main{width:min(100%,480px);min-height:100dvh;margin:auto;padding:18px 16px 26px;display:flex;flex-direction:column;align-items:center}
    header{width:100%;display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}h1{font-size:1.25rem;letter-spacing:.08em;margin:0}.tag{margin:0;color:#8fa0a6;font-size:.72rem}
    .panel{width:100%;padding:14px;border:1px solid #3b484d;border-radius:20px;background:#171e21;box-shadow:0 18px 50px #0008}
    .status{display:flex;justify-content:space-between;gap:8px;margin:0 4px 10px;color:#aab8bc;font-size:.78rem}.status output{color:#e9be72}
    canvas{display:block;width:100%;height:auto;border:1px solid #435158;border-radius:50%;background:#0b0f11;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
    .readout{min-height:1.5em;margin:10px 0 12px;text-align:center;color:#aebcc0;font-size:.78rem;font-variant-numeric:tabular-nums}
    .control{padding:12px;border:1px solid #344147;border-radius:14px;background:#111719}.control label{display:flex;justify-content:space-between;align-items:center;font-size:.88rem}.control output{color:#e9be72;font-weight:700}
    input[type=range]{width:100%;height:32px;margin:5px 0 0;accent-color:#e9be72}
    button{width:100%;min-height:54px;margin-top:11px;border:0;border-radius:14px;background:#e0a84e;color:#17130b;font:700 1rem inherit;box-shadow:0 4px 0 #8d6528;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #8d6528}
    .hint{margin:13px 5px 0;color:#829196;text-align:center;font-size:.72rem;line-height:1.55}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main>
  <header><h1>鍋振り試作機</h1><p class="tag">TOP VIEW / 物理テスト</p></header>
  <section class="panel" aria-label="中華鍋の粒子シミュレーション">
    <div class="status"><span id="sensorState">センサー停止中</span><output id="riceCount">米 48 / 48</output></div>
    <canvas id="scene" width="420" height="420" aria-label="上から見た中華鍋と米。ドラッグでも鍋を振れます"></canvas>
    <p id="readout" class="readout" aria-live="polite">リセットでセンサー取得・水平調整を開始</p>
    <div class="control">
      <label for="sensitivity"><span>センサー強度</span><output id="sensitivityValue">1.0×</output></label>
      <input id="sensitivity" type="range" min="0.2" max="2.5" value="1" step="0.1">
    </div>
    <button id="reset" type="button">リセットして計測開始</button>
    <p class="hint">画面を上にして右手で持ち、水平な状態でリセットしてください。<br>PCでは鍋のドラッグ、または矢印キーで動きを確認できます。<br>端末を落とさないよう周囲を確認してください。</p>
  </section>
</main>
<script>
(() => {
  'use strict';
  const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
  const stateEl=document.querySelector('#sensorState'),countEl=document.querySelector('#riceCount'),readout=document.querySelector('#readout');
  const sensitivity=document.querySelector('#sensitivity'),sensitivityValue=document.querySelector('#sensitivityValue');
  const TOTAL=48,CX=210,CY=210,RIM=176,DEPTH=72;
  let grains=[],drive={x:0,y:0,z:0},listening=false,baseline=null,last=performance.now(),pointer=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const bowlHeight=(x,y)=>-DEPTH*(1-Math.min(1,(x*x+y*y)/(RIM*RIM)));
  function seedRice(){
    grains=Array.from({length:TOTAL},(_,i)=>{const angle=i*2.4+Math.random()*.5,r=14+Math.sqrt(Math.random())*43;const x=Math.cos(angle)*r,y=Math.sin(angle)*r;return{x,y,z:bowlHeight(x,y)+2,vx:0,vy:0,vz:0};});
    countEl.value=`米 ${TOTAL} / ${TOTAL}`;
  }
  function calibrate(sample){baseline={x:sample.x,y:sample.y,z:sample.z};stateEl.textContent='水平調整済み';readout.textContent='計測中 — スマホを短く振ってください';}
  function motion(event){
    const raw=event.accelerationIncludingGravity||event.acceleration;if(!raw)return;
    const sample={x:raw.x||0,y:raw.y||0,z:raw.z||0};if(!baseline){calibrate(sample);return;}
    const gain=Number(sensitivity.value),dt=clamp((event.interval||16)/16,0.5,3);
    drive.x=clamp(drive.x-(sample.x-baseline.x)*.085*gain*dt,-4.5,4.5);
    drive.y=clamp(drive.y+(sample.y-baseline.y)*.085*gain*dt,-4.5,4.5);
    drive.z=clamp(drive.z+Math.abs(sample.z-baseline.z)*.035*gain*dt,0,2.5);
    readout.textContent=`入力 x ${drive.x.toFixed(2)} / y ${drive.y.toFixed(2)}`;
  }
  async function reset(){
    seedRice();drive={x:0,y:0,z:0};baseline=null;readout.textContent='水平のまま少し待ってください…';
    try{
      if(!('DeviceMotionEvent' in window))throw new Error('この端末ではセンサーを利用できません');
      if(typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw new Error('センサーが許可されませんでした');
      if(!listening){window.addEventListener('devicemotion',motion,{passive:true});listening=true;}
      stateEl.textContent='水平調整待ち';setTimeout(()=>{if(!baseline)readout.textContent='センサー入力待ち — ドラッグでも試せます';},700);
    }catch(error){stateEl.textContent='ポインター操作';readout.textContent=`${error.message}。鍋をドラッグしてください。`;}
  }
  function applyDrive(dx,dy,power=1){const gain=Number(sensitivity.value);drive.x=clamp(drive.x+dx*.055*gain*power,-5,5);drive.y=clamp(drive.y+dy*.055*gain*power,-5,5);drive.z=clamp(drive.z+(Math.abs(dx)+Math.abs(dy))*.006*gain,0,2.8);}
  function drawWok(){
    const grad=ctx.createRadialGradient(CX,CY,8,CX,CY,RIM);grad.addColorStop(0,'#10181b');grad.addColorStop(.72,'#202b2f');grad.addColorStop(1,'#536168');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(CX,CY,RIM,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#718087';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#344248';ctx.lineWidth=1;
    for(const r of [44,88,132]){ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(CX-RIM,CY);ctx.lineTo(CX+RIM,CY);ctx.moveTo(CX,CY-RIM);ctx.lineTo(CX,CY+RIM);ctx.stroke();
  }
  function frame(now){
    const dt=Math.min(2,(now-last)/16.67);last=now;ctx.clearRect(0,0,420,420);drawWok();let kept=0;
    for(const g of grains){
      if(g.lost)continue;g.vx+=drive.x*.12*dt;g.vy+=drive.y*.12*dt;g.vz+=(drive.z*.11-.19)*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.z+=g.vz*dt;
      const floor=bowlHeight(g.x,g.y),rad=Math.hypot(g.x,g.y);
      if(rad<RIM&&g.z<=floor+2){g.z=floor+2;if(g.vz<0)g.vz*=-.18;g.vx+=(-g.x/RIM)*.115*dt;g.vy+=(-g.y/RIM)*.115*dt;g.vx*=Math.pow(.974,dt);g.vy*=Math.pow(.974,dt);}
      if(rad>RIM+18&&g.z>0){g.lost=true;continue;}if(rad>RIM+45||g.z<-90){g.lost=true;continue;}kept++;
      const height=Math.max(0,g.z-floor),scale=1+Math.min(.7,height/95);ctx.fillStyle=`rgba(0,0,0,${.3-height/450})`;ctx.beginPath();ctx.ellipse(CX+g.x+height*.1,CY+g.y+height*.12,5*scale,2.8*scale,Math.atan2(g.vy,g.vx),0,Math.PI*2);ctx.fill();ctx.fillStyle=height>8?'#fff4c7':'#eadba8';ctx.beginPath();ctx.ellipse(CX+g.x,CY+g.y,4.4*scale,2.2*scale,Math.atan2(g.vy,g.vx),0,Math.PI*2);ctx.fill();
    }
    countEl.value=`米 ${kept} / ${TOTAL}`;drive.x*=Math.pow(.84,dt);drive.y*=Math.pow(.84,dt);drive.z*=Math.pow(.72,dt);requestAnimationFrame(frame);
  }
  canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!pointer)return;applyDrive(e.clientX-pointer.x,e.clientY-pointer.y);pointer={x:e.clientX,y:e.clientY};});
  canvas.addEventListener('pointerup',()=>{pointer=null;});canvas.addEventListener('pointercancel',()=>{pointer=null;});
  window.addEventListener('keydown',e=>{const d={ArrowLeft:[-18,0],ArrowRight:[18,0],ArrowUp:[0,-18],ArrowDown:[0,18]}[e.key];if(d){e.preventDefault();applyDrive(...d,1.8);}});
  sensitivity.addEventListener('input',()=>{sensitivityValue.value=`${Number(sensitivity.value).toFixed(1)}×`;});document.querySelector('#reset').addEventListener('click',reset);
  seedRice();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
