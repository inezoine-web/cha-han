<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>鍋振りシミュレーター Proto</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        canvas { display: block; margin: 20px auto; background: #111; border-radius: 50% 50% 20% 20%; border: 4px solid #555; }
        button { padding: 15px 30px; font-size: 18px; margin-top: 20px; border-radius: 8px; border: none; background: #ff5722; color: white; cursor: pointer; }
        #status { font-size: 24px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>鍋振りシミュレーター (Proto)</h1>
    <!-- iOS等のセンサー許可ボタン -->
    <button id="startBtn">センサー開始 ＆ 鍋セット</button>
    <div id="status">米の残量: 100%</div>
    <div id="debug" style="font-size: 12px; color: #aaa;"></div>

    <canvas id="panCanvas" width="300" height="200"></canvas>

<script>
const canvas = document.getElementById('panCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');
const debugDiv = document.getElementById('debug');

// --- 物理パラメータとモデル化 ---
const pan = {
    x: canvas.width / 2,
    y: 130,
    radius: 120, // 鍋の曲率（断面近似）
    vx: 0, vy: 0
};

// 米粒子の定義（まずはスマホでも超軽量な50粒から検証）
let particles = [];
const maxRice = 50;
let remainingRice = maxRice;

function initRice() {
    particles = [];
    remainingRice = maxRice;
    for(let i=0; i<maxRice; i++) {
        particles.push({
            x: pan.x + (Math.random() - 0.5) * 60,
            y: pan.y + 20 + (Math.random() - 0.5) * 10,
            vx: 0, vy: 0,
            isFlying: false
        });
    }
    updateStatus();
}

function updateStatus() {
    const pct = Math.round((remainingRice / maxRice) * 100);
    statusDiv.innerText = `米の残量: ${pct}%`;
}

// --- センサー処理 (DeviceMotion) ---
let accX = 0, accY = 0, accZ = 0;

document.getElementById('startBtn').addEventListener('click', async () => {
    // オーディオやセンサーの初期化トリガー
    initRice();
    
    // iOS 13+ のための権限リクエスト処理
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
            const permissionState = await DeviceMotionEvent.requestPermission();
            if (permissionState === 'granted') {
                window.addEventListener('devicemotion', handleMotion);
            } else {
                alert('センサーの利用が拒否されました。');
            }
        } catch (error) {
            console.error(error);
        }
    } else {
        // AndroidやPCブラウザ
        window.addEventListener('devicemotion', handleMotion);
    }
});

function handleMotion(event) {
    // 重力加速度を除いた純粋な慣性力 (m/s²)
    // 機種・OSによって軸の反転があるため、テスト時に要調整
    const acc = event.acceleration || {x:0, y:0, z:0};
    
    // スマホを縦に持ち、画面を上にして前後に振る場合：
    // Z軸（画面に対して垂直）や Y軸（スマホの縦方向）に強い力が入る
    accX = acc.x || 0;
    accY = acc.y || 0;
    accZ = acc.z || 0;

    // 簡易的にスマホの加速度を仮想鍋の速度に変換（一振り単位の運動のシミュレート用）
    // ローパスやハイパスを挟まないとドリフトしますが、プロト用にあえて直結
    pan.vx = -accX * 1.5; 
    pan.vy = -accY * 1.5; // 振った方向と逆に米が慣性で動くように調整

    debugDiv.innerText = `AccY(前後): ${accY.toFixed(2)} | AccZ(上下): ${accZ.toFixed(2)}`;
}

// --- メインループ（物理演算 ＆ 描画） ---
const gravity = 0.3;

function loop() {
    // 画面クリア
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 鍋の描画 (2D断面)
    ctx.beginPath();
    ctx.arc(pan.x, pan.y, pan.radius, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 6;
    ctx.stroke();

    // 鍋の中心と底の位置（衝突判定用）
    const panBottomY = pan.y + pan.radius;

    // 2. 米粒子の計算と描画
    particles.forEach((p, index) => {
        // 重力と鍋の運動の影響
        p.vy += gravity;
        
        // 鍋の中にいる（接地している）間は鍋の加速を受ける
        if (!p.isFlying) {
            p.vx += pan.vx * 0.1;
            p.vy += pan.vy * 0.1;
        }

        p.x += p.vx;
        p.y += p.vy;

        // 鍋肌（円弧）との衝突判定
        const dx = p.x - pan.x;
        const dy = p.y - pan.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist >= pan.radius - 2 && dy > 0) {
            // 鍋のフチ（左右の端）を超えて飛び出したかの判定
            if (p.x < pan.x - 80 || p.x > pan.x + 80) {
                if (p.y > panBottomY - 20) {
                    // 底に近い場合はバウンド
                    p.y = pan.y + (pan.radius - 3) * (dy / dist);
                    p.vy = -p.vy * 0.4; 
                } else {
                    // フチを超えて外に飛び出したらロスト
                    particles.splice(index, 1);
                    remainingRice--;
                    updateStatus();
                    playLossSound(); // ロスト音（仮）
                    return;
                }
            } else {
                // 鍋の内側での衝突・すべり挙動
                // 位置を鍋肌に固定
                p.x = pan.x + (pan.radius - 3) * (dx / dist);
                p.y = pan.y + (pan.radius - 3) * (dy / dist);
                
                // 法線ベクトルで反射（鍋を煽ったときに米が上に飛び出す力に変換）
                const nx = dx / dist;
                const ny = dy / dist;
                const dot = p.vx * nx + p.vy * ny;
                
                p.vx -= 2 * dot * nx;
                p.vy -= 2 * dot * ny;

                // 摩擦
                p.vx *= 0.9;
                
                // 一定以上の力で弾んだら飛行フラグON
                if (Math.abs(p.vy) > 2) {
                    p.isFlying = true;
                } else {
                    p.isFlying = false;
                }
            }
        }

        // 米の描画
        ctx.fillStyle = '#fffdf0';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI);
        ctx.fill();
    });

    // 鍋の速度を減衰（スマホ停止時に鍋も止まるように）
    pan.vx *= 0.5;
    pan.vy *= 0.5;

    requestAnimationFrame(loop);
}

// --- 音フィードバック（Web Audio APIによる簡易実装） ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playLossSound() {
    // 米がこぼれた時の「プツッ」という低い音
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

loop();
</script>
</body>
</html>
